[build-system]
requires = ['poetry-core']
build-backend = 'poetry.core.masonry.api'

[tool.poetry]
name = 'capsql'
version = '0.5.0'
description = ''
authors = ['Karl Kroening <karlk@kralnet.us>']
readme = 'README.md'

[tool.poetry.dependencies]
pygments = '*'
python = '>=3.11,<4'
sqlalchemy = { extras = ['asyncio'], version = '*' }
sqlparse = '*'

[tool.poetry.group.dev.dependencies]
aiosqlite = '*'
black = '*'
ipython = '*'
isort = { extras = ['colors'], version = '*' }
mock = '*'
mypy = '*'
pylint = '*'
pytest = '*'
pytest-asyncio = '*'
pytest-faker = '*'
pytest-mock = '*'
pytest-only = '*'
pytest-randomly = '*'
pytest-timeout = '*'
pytest-xdist = '*'
setuptools = '<80'  # TMP/FIXME: workaround for pytest-only being misbehaved
types-mock = '*'
types-pygments = '*'
types-setuptools = '<80'  # TMP/FIXME: workaround for pytest-only being misbehaved

[tool.black]
include = '^/(capsql|tests)/.*\.pyi?$'
skip-string-normalization = true
target_version = ['py311']

[tool.isort]
ensure_newline_before_comments = true
force_grid_wrap = 0
force_single_line = true
ignore_whitespace = true
include_trailing_comma = true
line_length = 88
multi_line_output = 3
no_sections = true
use_parentheses = true

[tool.mypy]
extra_checks = true
files = 'capsql'
mypy_path = 'stubs'
namespace_packages = true
no_implicit_optional = true
pretty = true
show_error_codes = true
show_error_context = true
show_traceback = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = 'capsql.*'
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_optional = true
no_implicit_reexport = true
strict_concatenate = true
strict_equality = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = '--pdbcls=IPython.terminal.debugger:Pdb'
filterwarnings = [
    'error::pytest.PytestUnraisableExceptionWarning',
    'error::RuntimeWarning',
    # 'error::pytest.PytestUnhandledCoroutineWarning',  # removed in recent pytest version?
]
asyncio_mode = 'auto'
markers = []
timeout = 5
